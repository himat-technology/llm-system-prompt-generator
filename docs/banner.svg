    <circle cx="94" cy="297" r="6" fill="#34d399"/>
    <text x="108" y="303">100% Browser-Local</text>
    <rect x="308" y="278" width="182" height="38" rx="19" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="330" cy="297" r="6" fill="#22d3ee"/>
