<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">LLM System Prompt Generator &amp; Optimizer by HiMat Technology</title>
  <desc id="desc">Design, structure, validate, and test production-grade AI system prompts with 100% browser-local privacy.</desc>
  <defs>
