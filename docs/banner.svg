  <text x="104" y="107" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="28" font-weight="700" fill="#6d28d9">{ }</text>
  <text x="152" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HiMat Technology</text>
  <text x="152" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.85">Free AI Engineering Tools</text>

  <text x="72" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">LLM System Prompt Generator &amp; Optimizer</text>
  <text x="72" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.92">Design, structure, validate, and test production-grade AI system prompts.</text>

